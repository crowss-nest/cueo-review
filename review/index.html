<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Cueo Review Destination</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f3ec; color: #171714; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f3ec; }
    main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
    .eyebrow { margin: 0 0 .75rem; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6254e8; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.02; letter-spacing: -.04em; }
    .threshold { width: 4.5rem; height: .38rem; margin: 1.5rem 0 2rem; border-radius: 999px; background: #7567f8; }
    p { font-size: 1.05rem; line-height: 1.65; }
    a { color: #6254e8; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Cueo · Review</p>
    <h1>Owned HTTPS review destination</h1>
    <div class="threshold" aria-hidden="true"></div>
    <p>If you can read this page, this browser reached Cueo's public review surface over HTTPS.</p>
    <p>This page does not require an account, does not load third-party scripts, and does not collect user-entered data.</p>
    <p><a href="./health.json">Service health</a></p>
  </main>
</body>
</html>
